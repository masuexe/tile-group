[package]
name = "tile-group"
version = "0.2.0"
edition = "2021"
description = "A lightweight, opt-in window group tiler for Windows"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
] }

# 磁盘与体积优化配置：减少 PDB 调试符号体积，Release 模式下极致压缩
[profile.dev]
debug = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
